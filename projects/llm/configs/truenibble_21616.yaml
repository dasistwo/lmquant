  wgts:
    static: true
    dtype: zint2
    group_shapes:
    - - 1
      - 16
    group_scale_dtypes:
    - torch.float16
    saturate_compute_dtype: false
    enable_calib_range: true
    calib_range:
      objective: ProductsError
      strategy: GridSearch
      granularity: Group
      degree: 2
      element_batch_size: 64
      sample_batch_size: -1
      element_size: 512
      sample_size: -1
      max_shrink: 0.8
      max_expand: 1.0
      num_grids: 20
      skip_proj_qkv: true
    enable_calib_kernel: true
    calib_kernel:
      enable_decoupleq: true
      decoupleq:
        calib_iteration: 3
        channel_batch: 128
        damp_percentage: 0.01
        block_size: 128
        num_inv_tries: 250
        hessian_block_size: 512
        include_proj_qkv: true
        include_proj_out: true
        include_proj_1st: true
        include_proj_2nd: true
  ipts:
    static: false
    dtype: null
    group_shapes:
    - - 1
      - -1
    group_scale_dtypes:
    - torch.float16
  opts:
    static: false
    dtype: null
    group_shapes:
    - - 1
      - -1
    group_scale_dtypes:
    - torch.float16
